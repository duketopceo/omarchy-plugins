name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --quiet pytest ruff shellcheck-py

      - name: Install qmllint
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      - name: Validate manifests
        run: python scripts/validate-manifests.py

      - name: Check plugin contract
        run: python scripts/check-plugin-contract.py

      - name: Check data lifecycle policy
        run: python scripts/check-data-lifecycle.py

      - name: Check release readiness
        run: python scripts/check-release-readiness.py

      - name: Check shared library sync
        run: python scripts/sync-shared.py --check

      - name: Check scorecard
        run: python scripts/check-scorecard.py

      - name: Check QML syntax
        env:
          REQUIRE_QMLLINT: "1"
        run: python scripts/check-qml-syntax.py

      - name: Ruff (syntax and undefined names)
        run: |
          ruff check --select E9,F63,F7,F82 scripts shared tests plugins
          helpers=$(grep -rlE '^#!.*python' plugins/*/bin packaging 2>/dev/null | grep -v '\.py$' || true)
          if [ -n "$helpers" ]; then ruff check --select E9,F63,F7,F82 $helpers; fi

      - name: Shellcheck (errors)
        run: shellcheck --severity=error $(grep -rlE '^#!.*\b(ba)?sh\b' scripts plugins packaging 2>/dev/null | grep -v '\.py$')

      - name: Run tests
        run: python -m pytest tests/ -q
